# OpenIDEA Discord Rich Presence Plugin Manifest
# Adheres to OpenIDEA 1.x manifest specification (^1.0).

id = "cunha.discord-rpc"
name = "Discord Rich Presence"
version = "0.2.1"
description = "Shows your active file, project, Git branch and session timer on your Discord profile, with language icons. Privacy Mode hides names, sensitive files are never shown. REQUIRES A SEPARATE INSTALL, the plugin does nothing without it: (1) Download openidea-discord-rpc-daemon for your OS from github.com/MathCunha16/OpenIDEA-Discord-Rcp/releases/latest (2) Rename it to openidea-discord-rpc-daemon (.exe on Windows) and put it on your PATH, e.g. ~/.local/bin (3) Open the Discord desktop app (4) Approve the process permission in Settings > Plugins (5) Run 'Discord RPC: Reconnect'. Status bar shows '● Discord' when working. To update, replace the file and repeat steps 4 and 5. Full guide: see homepage."
homepage = "https://github.com/MathCunha16/OpenIDEA-Discord-Rcp#daemon-installation"
authors = ["Matheus Cunha <matheuscunhaprado@proton.me>"]
license = "Apache-2.0"
change-notes = "0.2.1 — Security: strip userinfo, query and fragment from Git remotes so credentials never reach the Discord repository button. Versions are now synced from the Makefile (make bump). Requires daemon 0.2.1."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"

activation = [
  "on-startup-finished",
  "on-schedule:60",
  "on-event:editor-focused",
  "on-event:file-opened",
  "on-event:vcs-changed",
  "on-event:settings-changed",
  "on-command:discord-rpc.reconnect",
  "on-command:discord-rpc.toggle",
  "on-command:discord-rpc.install-help"
]

[capabilities]
required = [
  "project.read",
  "editor.read",
  "events",
  "process:openidea-discord-rpc-daemon"
]

[contributes.settings]
title = "Discord Rich Presence"
schema = "schemas/settings.json"

[[contributes.statusBar]]
id = "discord-rpc-status"
text = "● Discord"
command = "discord-rpc.toggle"

[[contributes.commands]]
id = "discord-rpc.toggle"
title = "Discord RPC: Toggle Presence"
category = "Discord"

[[contributes.commands]]
id = "discord-rpc.reconnect"
title = "Discord RPC: Reconnect"
category = "Discord"

[[contributes.commands]]
id = "discord-rpc.install-help"
title = "Discord RPC: Setup Guide"
category = "Discord"
