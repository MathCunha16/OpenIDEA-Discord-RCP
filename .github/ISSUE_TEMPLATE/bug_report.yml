name: "Bug Report"
description: "File an issue about something not working as expected."
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Before opening, please make sure you are running the latest version of the plugin and that Discord Desktop is actively running.

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: What version of the plugin are you running (e.g. 0.1.0)?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: openidea_version
    attributes:
      label: OpenIDEA Version
      description: What version of OpenIDEA are you using (Help › About)?
      placeholder: "1.4.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Linux (x86_64)"
        - "Linux (ARM64)"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Windows (x86_64)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: discord_client
    attributes:
      label: Discord Client Type
      description: Which build of Discord are you using?
      options:
        - "Discord Stable"
        - "Discord PTB"
        - "Discord Canary"
        - "Discord Flatpak / Snap"
        - "Discord Web / Browser (Not Supported for RPC)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open project '...'
        2. Open file '...'
        3. Observe Discord profile Rich Presence
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Daemon Logs
      description: Output from `/tmp/openidea-discord-rpc.log` (Linux/macOS) or `%TEMP%\openidea-discord-rpc.log` (Windows).
      render: shell
