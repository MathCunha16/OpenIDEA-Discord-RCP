# OpenIDEA Discord Rich Presence Plugin Manifest
# Adheres to OpenIDEA 1.x manifest specification (^1.0).

id = "cunha.discord-rpc"
name = "Discord Rich Presence"
version = "0.3.2"
description = "Discord Rich Presence for OpenIDEA. Displays your active file, project, Git branch, and session timer directly on your Discord profile with 250+ language icons and 6 themes. Features Privacy Mode, sensitive file filtering, and reactive status bar presence toggling. Runs 100% natively in WebAssembly with zero external daemons or setup."
homepage = "https://github.com/MathCunha16/OpenIDEA-Discord-Rcp"
authors = ["Matheus Cunha <matheuscunhaprado@proton.me>"]
license = "Apache-2.0"
change-notes = "0.3.2 — Preserve all settings across OpenIDEA's 5-minute idle reclaim (Privacy Mode, buttons, themes and custom formats no longer reset); smarter language/icon detection so docker-compose.yml, compose.yml, GitHub Actions workflows and manifests win over generic YAML/JSON reported by the IDE; disambiguate duplicate filenames such as two models.go in different folders; omit the repository button while showing the idle state."
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"

activation = [
  "on-startup-finished",
  "on-schedule:60",
  "on-event:editor-focused",
  "on-event:file-opened",
  "on-event:vcs-changed",
  "on-event:settings-changed",
  "on-command:discord-rpc.reconnect",
  "on-command:discord-rpc.toggle",
  "on-command:discord-rpc.install-help"
]

[capabilities]
required = [
  "project.read",
  "editor.read",
  "vcs.read",
  "events",
  "storage",
  'ipc:\\.\pipe\discord-ipc-*',
  "ipc:$XDG_RUNTIME_DIR/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/app/com.discordapp.Discord/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/app/dev.vencord.Vesktop/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/.flatpak/com.discordapp.Discord/xdg-run/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/.flatpak/dev.vencord.Vesktop/xdg-run/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/app/com.discordapp.DiscordCanary/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/app/com.discordapp.DiscordPTB/discord-ipc-*",
  "ipc:$XDG_RUNTIME_DIR/snap.discord/discord-ipc-*",
  "ipc:$TMPDIR/discord-ipc-*",
  "ipc:/tmp/discord-ipc-*"
]

[contributes.settings]
title = "Discord Rich Presence"
schema = "schemas/settings.json"

[[contributes.statusBar]]
id = "discord-rpc-status"
text = "● Discord"
command = "discord-rpc.toggle"

[[contributes.commands]]
id = "discord-rpc.toggle"
title = "Discord RPC: Toggle Presence"
category = "Discord"

[[contributes.commands]]
id = "discord-rpc.reconnect"
title = "Discord RPC: Reconnect"
category = "Discord"

[[contributes.commands]]
id = "discord-rpc.install-help"
title = "Discord RPC: About"
category = "Discord"

