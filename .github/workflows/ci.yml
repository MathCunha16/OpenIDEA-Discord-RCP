name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
  ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: true

jobs:
  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l pkg wasm/gen/app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go unit and race tests
        run: |
          go test -count=1 -v -race ./...
          cd wasm/gen && go test -count=1 -v -race ./app/...

      - name: Cross-platform Go vet
        run: |
          go vet ./...
          cd wasm/gen && go vet -unsafeptr=false ./app
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

  build-plugin:
    name: Build & Validate WASM Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install openidea-plugin CLI
        run: |
          mkdir -p ~/.local/bin
          curl -sSL "https://github.com/l0ng-ai/openidea/releases/download/v0.1.40/openidea-plugin-linux-x86_64.gz" | gzip -d > ~/.local/bin/openidea-plugin
          chmod +x ~/.local/bin/openidea-plugin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@latest

      - name: Build WASM component
        run: make wasm

      - name: Validate plugin manifest
        run: openidea-plugin check .

      - name: Package .oiplugin bundle
        run: make package

      - name: Validate packaged plugin bundle
        run: openidea-plugin check cunha.discord-rpc-*.oiplugin
