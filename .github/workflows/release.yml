name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.3.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
  ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Determine target version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Expected a vX.Y.Z tag, got '$RAW_TAG'"
            exit 1
          fi
          VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Target version: ${VER} (tag: ${RAW_TAG})"

      - name: Validate version consistency
        shell: bash
        run: |
          EXPECTED_VER="${{ steps.version.outputs.version }}"
          PLUGIN_VER=$(grep '^version = ' plugin.toml | cut -d '"' -f 2)
          MAKE_VER=$(grep '^VERSION :=' Makefile | awk '{print $3}')

          echo "Tag version:       $EXPECTED_VER"
          echo "plugin.toml:       $PLUGIN_VER"
          echo "Makefile:          $MAKE_VER"

          if [ "$PLUGIN_VER" != "$EXPECTED_VER" ]; then
            echo "::error::plugin.toml version ($PLUGIN_VER) does not match tag version ($EXPECTED_VER)"
            exit 1
          fi
          if [ "$MAKE_VER" != "$EXPECTED_VER" ]; then
            echo "::error::Makefile version ($MAKE_VER) does not match tag version ($EXPECTED_VER)"
            exit 1
          fi

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l pkg wasm/gen/app)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go unit and race tests
        run: |
          go test -count=1 -v -race ./...
          cd wasm/gen && go test -count=1 -v -race ./app/...

      - name: Cross-platform Go vet
        run: |
          go vet ./...
          (cd wasm/gen && go vet -unsafeptr=false ./app)
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

  build-plugin:
    name: Build & Package Plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install openidea-plugin CLI
        run: |
          mkdir -p ~/.local/bin
          curl -sSL "https://github.com/l0ng-ai/openidea/releases/download/v0.1.40/openidea-plugin-linux-x86_64.gz" | gzip -d > ~/.local/bin/openidea-plugin
          chmod +x ~/.local/bin/openidea-plugin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install componentize-go
        run: |
          go install github.com/bytecodealliance/componentize-go@v0.5.3

      - name: Compile WASM component
        run: make wasm

      - name: Validate plugin manifest before packing
        run: openidea-plugin check .

      - name: Pack and sign plugin
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.OPENIDEA_SIGNING_KEY }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          PACKAGE_NAME="cunha.discord-rpc-${VER}.oiplugin"

          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::OPENIDEA_SIGNING_KEY secret is not configured. Refusing to publish an unsigned release package."
            exit 1
          fi
          echo "Signing plugin using OPENIDEA_SIGNING_KEY..."
          KEY_FILE=$(mktemp)
          echo "$SIGNING_KEY" > "$KEY_FILE"
          openidea-plugin pack . --key "$KEY_FILE" --publisher cunha --out "$PACKAGE_NAME"
          rm -f "$KEY_FILE"

          echo "Validating created package..."
          openidea-plugin check "$PACKAGE_NAME"

      - name: Compute SHA-256 Checksums
        id: sha
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          PACKAGE_NAME="cunha.discord-rpc-${VER}.oiplugin"
          sha256sum "$PACKAGE_NAME" > checksums.txt
          HASH=$(awk '{print $1}' checksums.txt)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_HASH=${HASH}" >> "$GITHUB_ENV"
          echo "Package: ${PACKAGE_NAME}"
          echo "SHA-256: ${HASH}"
          cat checksums.txt

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: |
            cunha.discord-rpc-*.oiplugin
            checksums.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: release-assets

      - name: Determine tag & version
        id: vars
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          fi
          VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          PLUGIN_FILE=$(ls release-assets/cunha.discord-rpc-*.oiplugin | head -n1)
          PLUGIN_HASH=$(sha256sum "$PLUGIN_FILE" | awk '{print $1}')
          PLUGIN_BASENAME=$(basename "$PLUGIN_FILE")
          echo "plugin_file=${PLUGIN_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "plugin_sha256=${PLUGIN_HASH}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VER="${{ steps.vars.outputs.version }}"
          FILE="${{ steps.vars.outputs.plugin_file }}"
          HASH="${{ steps.vars.outputs.plugin_sha256 }}"

          cat << 'EOF' > release_body.md
          ## OpenIDEA Discord Rich Presence v${VER}

          ### 🚀 1-Click Native Discord Presence (Zero Daemon Setup!)
          OpenIDEA Discord Rich Presence is a **100% pure WebAssembly Component Model** plugin.
          - **No companion daemon or background executable required.**
          - **No external binary installation or `$PATH` configuration.**
          - Direct, secure connection to your local Discord desktop client through sandboxed IPC sockets (`ipc:...`).

          #### Quickstart
          1. Make sure your **Discord desktop app** is running.
          2. Install `cunha.discord-rpc-${VER}.oiplugin` in OpenIDEA (**Settings › Plugins › Install Plugin from Disk...** or via the OpenIDEA Plugin Marketplace).
          3. When prompted, allow the required IPC and editor capabilities.
          4. Rich Presence activates immediately! The status bar item displays **`● Discord`** when connected.

          ---

          ### 📦 Assets & Downloads
          - **Plugin Package**: `${FILE}`
            - **SHA-256**: `${HASH}`
          - **Checksums**: `checksums.txt`

          ---

          ### 📋 Marketplace Listing Info (`openidea-plugins`)
          For `l0ng-ai/openidea-plugins` repository submission:
          ```toml
          version = "${VER}"
          package = "https://github.com/MathCunha16/OpenIDEA-Discord-Rcp/releases/download/${TAG}/${FILE}"
          sha256 = "${HASH}"
          ```

          ---

          ### 📝 What's New in v${VER}
          - **Strict Safe Mode on activation**: Enforce privacy protections during plugin activation so that stale public snapshots cannot leak project or branch details before project-scoped settings are verified.
          - **Settings survive idle reclaim**: Privacy Mode, repository/IDE buttons, icon themes and custom line formats are persisted in host storage, so OpenIDEA's 5-minute idle reclaim no longer resets them to defaults (which could expose file, project and branch names).
          - **Smarter icon detection**: `docker-compose.yml`, `compose.yml`, `docker-compose.*.yml`, `Dockerfile`, GitHub Actions workflows and known manifests now take priority over the generic YAML/JSON/TOML language reported by the IDE.
          - **Duplicate filename disambiguation**: when two open files share a basename (e.g. two `models.go`), the presence shows the shortest distinguishing path (`ide/models.go` vs `app/models.go`); a single file keeps just its name.
          - **Cleaner idle presence**: the repository button is omitted while showing the idle state.
          - Runs 100% in WebAssembly with no companion daemon, direct sandboxed IPC, a reactive status bar, sensitivity filtering and Privacy Mode.
          EOF

          # Replace template variables
          sed -i "s/\${VER}/${VER}/g" release_body.md
          sed -i "s/\${TAG}/${TAG}/g" release_body.md
          sed -i "s/\${FILE}/${FILE}/g" release_body.md
          sed -i "s/\${HASH}/${HASH}/g" release_body.md

          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          cat release_body.md >> $GITHUB_STEP_SUMMARY

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: OpenIDEA Discord Rich Presence ${{ steps.vars.outputs.tag }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
